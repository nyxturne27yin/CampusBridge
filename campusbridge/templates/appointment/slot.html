{% extends 'base.html' %}
{% block content %}
<h2> Available Slots</h2>
{% for s in slots %}
<div class=" card p-2 mt-2">
<p> {{ s.counselor.username }}|{{ s.date  }}|{{ s.time_slot }}</p>
<a href="{% url 'book_slot' s.id %}"
class="btn btn-success btn-sm"> Book</a>

</div>
 {% empty %}
    <p> No slots available</p>
    {%  endfor %}
{% endblock %}
