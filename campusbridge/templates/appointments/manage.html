{% extends 'base.html' %}
{% block content %}

<style>
.page-title {
    text-align: center;
    font-size: 2.2rem;
    font-weight: 800;
    color: #11052C !important;
    letter-spacing: -0.5px;
    margin-bottom: 25px;
}

.app-title {
    font-weight: 800;
    font-size: 1.1rem;
    color: #11052C !important;
    margin-bottom: 8px;
}

.app-meta {
    font-size: 1rem;
    color: #2D2D3A !important;
    font-weight: 700;
    margin-bottom: 14px;
    line-height: 1.6;
}

.app-meta b {
    color: #000000 !important;
    font-weight: 800;
}

.empty-text {
    color: #49495e !important;
    font-weight: 700;
    font-size: 1.05rem;
}

.manage-wrapper {
    max-width: 850px;
    margin: auto;
    animation: smoothEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes smoothEntrance {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.app-card {
    background: #ffffff !important;
    border: 2px solid #e1d8ff !important;
    border-radius: 18px;
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: 0 4px 12px rgba(40, 40, 80, 0.04) !important;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.app-card:hover {
    transform: translateY(-3px);
    border-color: #7d61ff !important;
    box-shadow: 0 12px 24px rgba(125, 97, 255, 0.15) !important;
}

.status-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 800;
    background: #e9e5ff !important;
    border: 2px solid #7d61ff;
    color: #11052C !important;
    margin-left: 4px;
}

.action-row {
    display: flex;
    gap: 10px;
}

.btn-approve {
    background: linear-gradient(135deg, #1fa37e, #178a6a);
    color: #ffffff !important;
    padding: 8px 18px;
    border-radius: 20px;
    font-weight: 800;
    text-decoration: none;
    border: none;
    box-shadow: 0 4px 12px rgba(31, 163, 126, 0.2);
    transition: all 0.2s ease;
}

.btn-approve:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(31, 163, 126, 0.35);
}

.btn-reject {
    background: #ffd1d1;
    color: #820e17 !important;
    padding: 8px 18px;
    border-radius: 20px;
    font-weight: 800;
    text-decoration: none;
    border: 2px solid #f27474;
    transition: all 0.2s ease;
}

.btn-reject:hover {
    background: #fca1a1;
    transform: translateY(-1px);
}
</style>

<div class="manage-wrapper mt-4">

    <h2 class="page-title">
        Manage Appointments
    </h2>

    {% for a in appointments %}

    <div class="app-card">

        <div class="app-title">
            Student ID: {{ a.anonymous_profile.id }}
        </div>

        <div class="app-meta">
            Date: <b>{{ a.slot.date }}</b><br>
            Time: <b>{{ a.slot.time_slot }}</b><br>

            Status:
            <span class="status-badge">
                {{ a.status }}
            </span>
        </div>

        <div class="action-row">

            <a href="{% url 'update_appointment' a.id 'approved' %}"
               class="btn-approve">
                Approve
            </a>

            <a href="{% url 'update_appointment' a.id 'rejected' %}"
               class="btn-reject"
               onclick="return confirm('This will permanently delete the appointment. Continue?');">
                Reject
            </a>

        </div>

    </div>

    {% empty %}
        <p class="text-center py-4 empty-text">No appointments found.</p>
    {% endfor %}

</div>

{% endblock %}
