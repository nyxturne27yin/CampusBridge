<div class="container py-5">

    <div class="text-center mb-5">
        <h2 class="fw-light"
            style="font-family: 'Cinzel', serif; color: #f4fff9; font-size: 26px; letter-spacing: 1.5px;">
            Available Appointment Slots
        </h2>
    </div>

    {% regroup slots by date as slot_days %}

    {% for day in slot_days %}

    <div class="mb-4 mx-auto" style="max-width: 750px;">

        <div class="d-flex align-items-center mb-2 px-1">
            <span style="font-family: 'Cinzel', serif; color: #ffe6a3; font-size: 0.95rem; font-weight: 400; letter-spacing: 1px;">
                {{ day.grouper }}
            </span>
            <div class="ms-3 flex-grow-1" style="height: 1px; background: rgba(168, 255, 208, 0.15);"></div>
        </div>

        <div class="table-responsive" style="border-radius: 10px; border: 1px solid rgba(168, 255, 208, 0.2);">
            <table class="table table-borderless text-center align-middle mb-0"
                   style="background: rgba(7, 18, 10, 0.95);">

                <thead>
                    <tr style="background: rgba(0, 0, 0, 0.3); color: #bdffdc; font-weight: 400; font-size: 0.85rem; letter-spacing: 0.5px; border-bottom: 1px solid rgba(168, 255, 208, 0.15);">
                        <th style="padding: 10px; font-weight: 400;">Counselor</th>
                        <th style="padding: 10px; font-weight: 400;">Time Slot</th>
                        <th style="padding: 10px; font-weight: 400;">Action</th>
                    </tr>
                </thead>

                <tbody>
                    {% for slot in day.list %}
                    <tr style="border-bottom: 1px solid rgba(168, 255, 208, 0.08);" class="clean-chart-row">

                        <td style="padding: 12px; color: #f4fff9; font-weight: 300; font-size: 0.95rem;">
                            {{ slot.counselor.username }}
                        </td>

                        <td style="padding: 12px; color: #bdffdc; font-weight: 300; font-size: 0.95rem;">
                            {{ slot.time_slot }}
                        </td>

                        <td style="padding: 12px;">
                            <a href="{% url 'book_slot' slot.id %}"
                               class="btn btn-primary btn-sm"
                               style="font-size: 0.8rem; font-weight: 500; padding: 3px 14px; border-radius: 6px; font-family: 'Inter', sans-serif;">
                                Book
                            </a>
                        </td>

                    </tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>

    </div>

    {% empty %}

    <div class="text-center py-4 mx-auto rounded-3"
         style="max-width: 400px; background: rgba(7, 18, 10, 0.95); border: 1px solid rgba(168, 255, 208, 0.15);">
        <p class="mb-0" style="font-weight: 300; font-size: 0.9rem; color: rgba(168, 255, 208, 0.6); font-style: italic;">No appointment slots available.</p>
    </div>

    {% endfor %}

</div>

<style>
    body {
        background:
            radial-gradient(circle at 10% 20%, rgba(189, 166, 255, 0.12), transparent 40%),
            radial-gradient(circle at 90% 85%, rgba(168, 255, 208, 0.12), transparent 40%),
            radial-gradient(circle at 50% 50%, rgba(34, 58, 43, 0.65), transparent 75%),
            #0b110e !important;
        background-attachment: fixed !important;
    }
    .clean-chart-row:hover {
        background: rgba(168, 255, 208, 0.04) !important;
    }
</style>
