<!DOCTYPE html>
<html>
<head>
    <title>CampusBridge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #F6F5FA;
            font-family: "Segoe UI", sans-serif;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #CDB4DB, #A7C7E7, #B8E0D2);
        }

        .navbar-brand {
            font-weight: 600;
            color: #2b2b2b !important;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }

        .btn-primary {
            background: #CDB4DB;
            border: none;
            color: #2b2b2b;
        }

        .btn-primary:hover {
            background: #b79acb;
        }

        .btn-success {
            background: #B8E0D2;
            border: none;
            color: #2b2b2b;
        }

        .btn-success:hover {
            background: #a6d6c6;
        }

        .btn-outline-light {
            border-color: white;
            color: white;
        }

        .btn-outline-light:hover {
            background: white;
            color: #3b2f4a;
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar .btn-light {
            background: white;
            border: none;
            color: #3b2f4a;
        }

        .navbar .btn-light:hover {
            background: #f1ecf8;
        }
    </style>
</head>

<body>

<header class="app-header">
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">

    <div class="container">

        <a class="navbar-brand" href="/">CampusBridge</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">

            <div class="ms-auto d-flex gap-2">

                {% if user.is_authenticated %}

                    <a class="btn btn-light btn-sm" href="{% url 'dashboard_redirect' %}">
                        Dashboard
                    </a>

                    <a class="btn btn-light btn-sm" href="{% url 'conversation_list' %}">
                        Messages
                    </a>

                    <a class="btn btn-light btn-sm" href="{% url 'view_slots' %}">
                        Appointments
                    </a>

                    <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">
                        Logout
                    </a>

                {% else %}

                    <a class="btn btn-light btn-sm" href="{% url 'login' %}">
                        Login
                    </a>

                    <a class="btn btn-light btn-sm" href="{% url 'register' %}">
                        Register
                    </a>

                {% endif %}

            </div>

        </div>

    </div>

</nav>
</header>

<main class="container mt-4">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
