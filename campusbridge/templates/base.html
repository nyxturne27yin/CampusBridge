<!DOCTYPE html>
<html>
<head>
    <title>CampusBridge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #F7F9FC;
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-custom {
            background: #2F6FED;
        }

        .card {
            border-radius: 12px;
        }

        .btn-primary {
            background: #2F6FED;
            border: none;
        }
    </style>
</head>

<body>

<!-- HEADER WRAPPER -->
<header class="app-header">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">

        <div class="container">

            <!-- BRAND -->
            <a class="navbar-brand fw-bold" href="/">
                CampusBridge
            </a>

            <!-- TOGGLE (mobile) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- NAV ITEMS -->
            <div class="collapse navbar-collapse" id="navMenu">

                <div class="ms-auto d-flex align-items-center gap-2">

                    {% if user.is_authenticated %}

                        <a class="btn btn-light btn-sm" href="{% url 'dashboard_redirect' %}">
                            Dashboard
                        </a>

                        <a class="btn btn-light btn-sm" href="/messaging/">
                            Messages
                        </a>

                   <a class="btn btn-light btn-sm" href="{% url 'view_slots' %}" >
    Appointments
</a>

                        <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">
                            Logout
                        </a>

                    {% else %}

                        <a class="btn btn-light btn-sm" href="{% url 'login' %}">
                            Login
                        </a>

                        <a class="btn btn-outline-light btn-sm" href="{% url 'register' %}">
                            Register
                        </a>

                    {% endif %}

                </div>

            </div>

        </div>

    </nav>

</header>

<!-- PAGE CONTENT -->
<main class="container mt-4">

    {% block content %}{% endblock %}

</main>

</body>
</html>
