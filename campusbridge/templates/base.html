<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CampusBridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= ENCHANTED COTTAGE FAIRYCORE UI SYSTEM ================= */

:root {
    /* Deep mythical woods canvas */
    --bg: #0b110e;

    /* Bioluminescent text layout */
    --text: #f5fcf7;
    --muted: #a6bfae;

    /* Mythical crystalline tones */
    --spore-glow: #a8ffd0;
    --mystic-lavender: #bda6ff;
    --fairy-pink: #fca1c1;
    --deep-moss: #223a2b;
    --ancient-bark: #2a1f1d;
    --gold-dust: #e3bc76;

    /* Crystalline organic textures */
    --card: rgba(18, 29, 23, 0.65);
    --card-strong: rgba(28, 46, 36, 0.85);
    --border: rgba(168, 255, 208, 0.18);

    /* Mythical depth glowing dropshadows */
    --neon-glow: 0 0 25px rgba(168, 255, 208, 0.15), 0 15px 45px rgba(0, 0, 0, 0.8);
    --inner-bevel: inset 0 1px 2px rgba(255, 255, 255, 0.15);
}

/* ================= BODY & BACKGROUND FOREST ================= */

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow-x: hidden;
    position: relative;

    /* Deep bioluminescent glowing coordinates */
    background:
        radial-gradient(circle at 10% 20%, rgba(189, 166, 255, 0.18), transparent 40%),
        radial-gradient(circle at 90% 15%, rgba(252, 161, 193, 0.15), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(34, 58, 43, 0.8), transparent 70%),
        radial-gradient(circle at 30% 85%, rgba(168, 255, 208, 0.12), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(227, 188, 118, 0.08), transparent 50%),
        var(--bg);
    background-attachment: fixed;
}

/* ================= PURE CSS MYTHICAL SPORE SYSTEM ================= */

body::before, body::after {
    content: "";
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--spore-glow);
    box-shadow:
        40vw 20vh 8px var(--spore-glow), 80vw 50vh 12px var(--fairy-pink),
        15vw 70vh 6px var(--mystic-lavender), 65vw 85vh 10px var(--gold-dust),
        90vw 30vh 8px var(--spore-glow), 35vw 45vh 14px var(--fairy-pink);
    opacity: 0.6;
    z-index: 0;
    pointer-events: none;
    animation: driftParticles 22s linear infinite alternate;
}

body::after {
    width: 6px;
    height: 6px;
    box-shadow:
        50vw 15vh 14px var(--gold-dust), 25vw 60vh 8px var(--spore-glow),
        75vw 35vh 10px var(--mystic-lavender), 10vw 80vh 12px var(--fairy-pink);
    animation-duration: 35s;
    animation-delay: -10s;
}

@keyframes driftParticles {
    0% { transform: translateY(0) translateX(0) scale(1); filter: hue-rotate(0deg); }
    100% { transform: translateY(-40px) translateX(30px) scale(1.3); filter: hue-rotate(45deg); }
}

/* ================= NAVBAR ================= */

.navbar {
    background: rgba(11, 17, 14, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 2px solid rgba(168, 255, 208, 0.15);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 10;
}

.brand {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(168, 255, 208, 0.4);
    background: linear-gradient(90deg, var(--spore-glow), var(--mystic-lavender), var(--fairy-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.nav-link {
    color: var(--muted) !important;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 13px;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.nav-link:hover, .nav-link:focus {
    color: var(--spore-glow) !important;
    transform: translateY(-2px);
    text-shadow: 0 0 8px rgba(168, 255, 208, 0.6);
}

/* ================= ENCHANTED VINE CARDS ================= */

.card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--neon-glow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: relative;
    z-index: 1;
    transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Vine corner filigree mock representation */
.card::before {
    content: '✦';
    position: absolute;
    top: 8px;
    left: 12px;
    font-size: 12px;
    color: var(--gold-dust);
    opacity: 0.5;
    transition: opacity 0.3s ease;
}

.card:hover {
    transform: translateY(-8px) scale(1.01);
    background: var(--card-strong);
    border-color: rgba(168, 255, 208, 0.45);
    box-shadow: 0 0 35px rgba(168, 255, 208, 0.25), 0 20px 50px rgba(0, 0, 0, 0.9);
}

.card:hover::before {
    opacity: 1;
    text-shadow: 0 0 8px var(--gold-dust);
}

/* ================= RUNIC WITCH BUTTONS ================= */

.btn-primary {
    background: linear-gradient(135deg, var(--deep-moss), var(--ancient-bark));
    border: 2px solid var(--spore-glow);
    color: var(--spore-glow) !important;
    border-radius: 16px;
    font-weight: 700;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
    padding: 10px 24px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4), var(--inner-bevel);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.btn-primary::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: rotate(45deg);
    transition: 0.5s;
}

.btn-primary:hover {
    color: #ffffff !important;
    background: linear-gradient(135deg, var(--provence-lavender, #7d72a9), var(--deep-moss));
    border-color: var(--fairy-pink);
    box-shadow: 0 0 20px rgba(252, 161, 193, 0.6), var(--inner-bevel);
    transform: translateY(-2px);
}

.btn-primary:hover::after {
    left: 120%;
}

.btn-soft {
    background: rgba(168, 255, 208, 0.08);
    color: var(--muted);
    border: 1px solid rgba(168, 255, 208, 0.15);
    border-radius: 14px;
    font-weight: 600;
    transition: all 0.25s ease;
}

.btn-soft:hover {
    background: rgba(168, 255, 208, 0.18);
    color: var(--spore-glow);
    border-color: var(--spore-glow);
    box-shadow: 0 0 12px rgba(168, 255, 208, 0.2);
}

/* ================= WITCHCRAFT INTERFACE FORMS ================= */

.form-control, .form-select, input, textarea, select {
    border-radius: 14px !important;
    border: 2px solid rgba(168, 255, 208, 0.12) !important;
    padding: 12px 16px !important;
    background: rgba(11, 17, 14, 0.70) !important;
    color: var(--text) !important;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5) !important;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

.form-control:focus, input:focus, textarea:focus, select:focus {
    background: rgba(18, 29, 23, 0.9) !important;
    border-color: var(--fairy-pink) !important;
    outline: 0 !important;
    box-shadow: 0 0 18px rgba(252, 161, 193, 0.35), inset 0 2px 5px rgba(0, 0, 0, 0.5) !important;
}

/* ================= DESIGN TYPOGRAPHY ================= */

p {
    color: var(--muted);
    line-height: 1.6;
}

h1, h2, h3, h4, h5, h6 {
    font-family: 'Cinzel', serif;
    color: var(--spore-glow);
    letter-spacing: 0.5px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.4);
}

/* ================= STRUCTURE & ENTRY ANIMATIONS ================= */

.page-container {
    padding-top: 4rem;
    padding-bottom: 4rem;
    position: relative;
    z-index: 2;
}

.fade-in {
    animation: mythicalEntrance 0.85s cubic-bezier(0.215, 0.610, 0.355, 1);
}

@keyframes mythicalEntrance {
    from {
        opacity: 0;
        transform: translateY(24px) scale(0.98);
        filter: blur(4px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

</style>
</head>

<body>

<div class="position-fixed top-50 start-50 translate-middle pointer-events-none"
     style="width: 500px; height: 500px; background: radial-gradient(circle, rgba(168,255,208,0.05) 0%, transparent 70%); z-index: 0; pointer-events: none;">
</div>

<nav class="navbar navbar-expand-lg sticky-top">
<div class="container">

<a class="navbar-brand brand" href="/">CampusBridge</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation" style="border-color: var(--border);">
<span class="bi bi-list style" style="color: var(--spore-glow); font-size: 24px;"></span>
</button>

<div class="collapse navbar-collapse" id="nav">

<ul class="navbar-nav ms-auto gap-2 align-items-center">

<li class="nav-item"><a class="nav-link" href="/">Home</a></li>
<li class="nav-item"><a class="nav-link" href="/dashboard/">Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'view_slots' %}">Appointments</a></li>
<li class="nav-item"><a class="nav-link" href="/messaging/">Messaging</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'my_request' %}">Support</a></li>

{% if user.is_authenticated %}
<li class="nav-item ms-lg-2"><a class="btn btn-soft btn-sm text-danger px-3" href="/logout/">Logout</a></li>
{% else %}
<li class="nav-item"><a class="nav-link" href="/login/">Login</a></li>
<li class="nav-item ms-lg-2"><a class="btn btn-primary btn-sm px-4" href="/register/">Register</a></li>
{% endif %}

</ul>

</div>
</div>
</nav>

<div class="container page-container fade-in">
{% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
