<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CampusBridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
:root {
    --bg1: #f4f7ff;
    --bg2: #f3efff;
    --bg3: #eafaff;
    --card: rgba(255, 255, 255, 0.65);
    --card-strong: rgba(255, 255, 255, 0.90);
    --text: #2b2b36;
    --muted: #666680;
    --lavender: #7d61ff;
    --ice-blue: #5c9eff;
    --mint: #49dcb1;
    --rose: #fcaecb;
    --soft-coffee: #201230;
    --border: rgba(110, 110, 140, 0.15);
    --shadow: 0 16px 36px rgba(40, 40, 80, 0.06), 0 4px 12px rgba(40, 40, 80, 0.02);
}

body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    color: var(--text);
    overflow-x: hidden;
    position: relative;
    background:
        radial-gradient(circle at 10% 15%, var(--bg2), transparent 50%),
        radial-gradient(circle at 90% 25%, var(--bg3), transparent 50%),
        radial-gradient(circle at 50% 85%, var(--bg1), transparent 60%),
        linear-gradient(180deg, #ffffff, #f4f7ff);
    background-attachment: fixed;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 15% 25%, rgba(195, 176, 255, 0.22), transparent 25%),
        radial-gradient(circle at 75% 55%, rgba(181, 215, 255, 0.25), transparent 30%),
        radial-gradient(circle at 35% 75%, rgba(179, 240, 223, 0.20), transparent 25%);
    z-index: 0;
    animation: floatingAtmosphere 16s ease-in-out infinite alternate;
}

@keyframes floatingAtmosphere {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-15px) scale(1.03); }
}

.navbar {
    background: linear-gradient(90deg, rgba(243, 239, 255, 0.9), rgba(234, 250, 255, 0.9), rgba(255, 238, 244, 0.9)) !important;
    background-size: 300% 300% !important;
    animation: gradientShift 12s ease infinite;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 2px solid #c3b0ff;
    box-shadow: 0 8px 32px rgba(125, 97, 255, 0.12);
    z-index: 10;
    padding: 0.85rem 0;
    transition: all 0.4s ease;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.brand {
    font-family: 'Pacifico', cursive;
    font-size: 26px;
    background: linear-gradient(135deg, #736482, #50435c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-decoration: none;
    transition: transform 0.3s ease, filter 0.3s ease;
}

.brand:hover {
    transform: scale(1.02);
    filter: drop-shadow(0 2px 8px rgba(195, 176, 255, 0.4));
}

.nav-link {
    color: #201230 !important;
    font-weight: 800;
    font-size: 15px;
    padding: 0.6rem 1.1rem !important;
    border-radius: 30px;
    position: relative;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.nav-link::after {
    content: '';
    position: absolute;
    width: 0;
    height: 3px;
    bottom: 2px;
    left: 50%;
    background: linear-gradient(90deg, #7d61ff, #fcaecb);
    border-radius: 2px;
    transition: all 0.3s ease;
    transform: translateX(-50%);
}

.nav-link:hover::after {
    width: 60%;
}

.nav-link:hover, .nav-link:focus {
    color: #7d61ff !important;
    background: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(125, 97, 255, 0.15);
}

/* Enhanced Login & Register Navigation Buttons */
.nav-btn-login {
    color: #7d61ff !important;
    background: rgba(255, 255, 255, 0.9);
    border: 2px solid #7d61ff !important;
    font-weight: 800;
    font-size: 15px;
    padding: 0.5rem 1.3rem !important;
    border-radius: 30px;
    box-shadow: 0 4px 12px rgba(125, 97, 255, 0.1);
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.nav-btn-login:hover {
    background: #7d61ff !important;
    color: #ffffff !important;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(125, 97, 255, 0.3);
}

.nav-btn-register {
    background: linear-gradient(135deg, #7d61ff, #5c9eff) !important;
    color: #ffffff !important;
    border: none !important;
    font-weight: 800;
    font-size: 15px;
    padding: 0.6rem 1.4rem !important;
    border-radius: 30px;
    box-shadow: 0 6px 16px rgba(125, 97, 255, 0.3);
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.nav-btn-register:hover {
    transform: translateY(-2px);
    filter: brightness(1.05);
    box-shadow: 0 8px 22px rgba(125, 97, 255, 0.45);
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: relative;
    z-index: 1;
    padding: 24px;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.card:hover {
    transform: translateY(-6px);
    background: var(--card-strong);
    border-color: rgba(195, 176, 255, 0.4);
    box-shadow: 0 22px 45px rgba(40, 40, 80, 0.09);
}

.btn-primary {
    background: linear-gradient(135deg, var(--lavender), var(--ice-blue));
    border: none;
    border-radius: 30px;
    font-weight: 800;
    color: #ffffff !important;
    padding: 11px 28px;
    box-shadow: 0 8px 20px rgba(125, 97, 255, 0.35);
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.btn-primary:hover {
    transform: translateY(-2.5px);
    filter: brightness(1.05);
    box-shadow: 0 12px 26px rgba(125, 97, 255, 0.5);
}

.btn-primary:active {
    transform: translateY(-0.5px);
}

.btn-soft {
    background: linear-gradient(135deg, var(--mint), var(--rose));
    border: none;
    border-radius: 30px;
    color: #201230 !important;
    font-weight: 800;
    padding: 9px 24px;
    box-shadow: 0 6px 16px rgba(40, 40, 80, 0.04);
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.btn-soft:hover {
    transform: translateY(-2px);
    filter: brightness(1.02);
    box-shadow: 0 10px 22px rgba(40, 40, 80, 0.08);
}

.form-control, .form-select, input, textarea, select {
    border-radius: 16px !important;
    border: 1px solid var(--border) !important;
    background: rgba(255, 255, 255, 0.75) !important;
    color: var(--text) !important;
    padding: 12px 18px !important;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.01) !important;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

.form-control:focus, input:focus, textarea:focus, select:focus {
    background: #ffffff !important;
    border-color: var(--lavender) !important;
    outline: 0 !important;
    box-shadow: 0 0 0 4px rgba(125, 97, 255, 0.25) !important;
}

.form-control::placeholder {
    color: #555566;
}

p {
    color: var(--muted);
    line-height: 1.65;
}

h1, h2, h3, h4, h5, h6 {
    color: #000000 !important;
    font-weight: 800;
}

.page-container {
    padding-top: 5rem;
    padding-bottom: 5rem;
    position: relative;
    z-index: 2;
}

.fade-in {
    animation: smoothEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes smoothEntrance {
    from {
        opacity: 0;
        transform: translateY(16px);
        filter: blur(2px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg sticky-top">
<div class="container">

<a class="navbar-brand brand" href="/">CampusBridge</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation" style="border: 2px solid #7d61ff; border-radius: 12px; padding: 6px 10px;">
<span class="bi bi-list" style="color: #201230; font-size: 22px;"></span>
</button>

<div class="collapse navbar-collapse" id="nav">

<ul class="navbar-nav ms-auto gap-3 align-items-center">

<li class="nav-item"><a class="nav-link" href="/">Home</a></li>
<li class="nav-item"><a class="nav-link" href="/dashboard/">Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'view_slots' %}">Appointments</a></li>
<li class="nav-item"><a class="nav-link" href="/messaging/">Messaging</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'my_request' %}">Support</a></li>

{% if user.is_authenticated %}
<li class="nav-item ms-lg-2"><a class="btn btn-soft btn-sm text-danger px-4" href="/logout/">Logout</a></li>
{% else %}
<li class="nav-item"><a class="btn nav-btn-login" href="/login/">Login</a></li>
<li class="nav-item"><a class="btn nav-btn-register text-white" href="/register/">Register</a></li>
{% endif %}

</ul>

</div>
</div>
</nav>

<div class="container page-container fade-in">
{% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
