<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusBridge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        /* =========================
           GLOBAL THEME (FAIRCORE)
        ========================== */

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(-45deg,
                #f5f3ff,
                #fdf2f8,
                #ecfdf5,
                #eef2ff
            );
            background-size: 400% 400%;
            animation: gradientFlow 12s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientFlow {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }


        .navbar {
            padding: 16px 0;
            backdrop-filter: blur(18px);
            background: rgba(255,255,255,0.65);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }

        .brand {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(90deg,#7c3aed,#ec4899,#10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            font-weight: 500;
            margin: 0 6px;
            position: relative;
            transition: 0.3s;
            color: #333 !important;
        }

        .nav-link:hover {
            color: #7c3aed !important;
            transform: translateY(-1px);
        }

        .nav-link.active {
            color: #7c3aed !important;
        }

        .nav-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg,#7c3aed,#ec4899);
            transition: 0.3s;
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }

        /* =========================
           GLASS CARD SYSTEM
        ========================== */

        .glass-card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.4);
            transition: 0.3s;
        }

        .glass-card:hover {
            transform: translateY(-4px);
        }

        /* =========================
           BUTTONS
        ========================== */

        .btn-primary {
            background: linear-gradient(135deg,#7c3aed,#ec4899);
            border: none;
            border-radius: 12px;
            padding: 8px 14px;
        }

        .btn-primary:hover {
            transform: scale(1.03);
        }

        /* secondary calm button */
        .btn-soft {
            background: rgba(124,58,237,0.1);
            color: #7c3aed;
            border-radius: 12px;
        }

        /* =========================
           FORM FIX (LOGIN/REGISTER)
        ========================== */

        input, select {
            border-radius: 12px !important;
            padding: 10px !important;
            border: 1px solid rgba(0,0,0,0.1) !important;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(124,58,237,0.15) !important;
            border-color: #7c3aed !important;
        }

        /* =========================
           LAYOUT HELPERS
        ========================== */

        .page-container {
            padding: 30px;
        }

        .section-title {
            font-weight: 700;
            color: #333;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">

        <a class="navbar-brand brand" href="/">CampusBridge</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/dashboard/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'view_slots' %}">Appointments</a></li>
                <li class="nav-item"><a class="nav-link" href="/messaging/">Messaging</a></li>

                <!-- SUPPORT FIXED -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'my_request'%}">
                        Support
                    </a>
                </li>

                {% if user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link text-danger" href="/logout/">Logout</a></li>
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="/login/">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="/register/">Register</a></li>
                {% endif %}

            </ul>

        </div>
    </div>
</nav>

<!-- PAGE CONTENT -->
<div class="container page-container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
