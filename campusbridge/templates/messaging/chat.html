{% extends 'base.html' %}
{% block content %}

<style>
.chat-wrapper {
    max-width: 750px;
    margin: auto;
    display: flex;
    flex-direction: column;
    height: 80vh;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
    background: #f3f4f6;
}

/* message container */
.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* base message */
.msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 16px;   /* BIGGER FONT */
    line-height: 1.5;
    word-wrap: break-word;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

/* SENT MESSAGE (you) */
.msg.me {
    align-self: flex-end;
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    color: white;
    border-bottom-right-radius: 6px;
}

/* RECEIVED MESSAGE */
.msg.other {
    align-self: flex-start;
    background: #ffffff;
    color: #111827;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 6px;
}

/* sender info */
.meta {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 5px;
}

/* input bar */
.chat-input {
    display: flex;
    padding: 12px;
    border-top: 1px solid #ddd;
    background: white;
}

.chat-input input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 25px;
    border: 1px solid #ccc;
    font-size: 15px;
    outline: none;
}

.chat-input button {
    margin-left: 10px;
    border: none;
    padding: 10px 18px;
    border-radius: 25px;
    background: #4f46e5;
    color: white;
    font-weight: 500;
    cursor: pointer;
}

.chat-input button:hover {
    background: #4338ca;
}
</style>

<h2 class="text-center mb-2">Chat</h2>

<div class="chat-wrapper">

    <!-- messages -->
    <div class="chat-box">
        {% for m in messages %}

            <div class="msg {% if m.sender == request.user %}me{% else %}other{% endif %}">
                {{ m.text }}

                <div class="meta">
                    {{ m.sender_type }}
                </div>
            </div>

        {% endfor %}
    </div>

    <!-- input -->
    <form method="POST" action="{% url 'send_message' convo.id %}" class="chat-input">
        {% csrf_token %}
        <input type="text" name="text" placeholder="Type a message..." required>
        <button type="submit">Send</button>
    </form>

</div>

{% endblock %}
