{% extends 'base.html' %}
{% block content%}
<h2> Chat</h2>
{% for m in messages %}
<div class="card p-2 mt-2">
<p>{{ m.text }}</p>
<small> {{m.sender_type}}</small>
</div>
    {% endfor %}
<form method="POST" action="{% url 'send_message' convo.id %}">
    {% csrf_token %}
    <input  type="text" name="text"  class="form-control">
    <button class="btn btn-success mt-2"> Send
</button>
</form>
{% endblock %}
