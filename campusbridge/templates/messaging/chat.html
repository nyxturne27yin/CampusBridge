{% extends 'base.html' %}
{% block content %}

<style>
.chat-wrapper {
    max-width: 750px;
    margin: auto;
    display: flex;
    flex-direction: column;
    height: 80vh;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    overflow: hidden;
    background: #f9fafb;
}

/* chat area */
.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* base message */
.msg {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 16px;
    line-height: 1.5;
    word-wrap: break-word;
    position: relative;
}

/* SENT (RIGHT SIDE) */
.msg.me {
    align-self: flex-end;
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    color: white;
    border-bottom-right-radius: 6px;
    text-align: left;
}

/* RECEIVED (LEFT SIDE) */
.msg.other {
    align-self: flex-start;
    background: #ffffff;
    color: #111827;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 6px;
}

/* meta info */
.meta {
    font-size: 11px;
    margin-top: 6px;
    opacity: 0.7;
}

/* input bar */
.chat-input {
    display: flex;
    padding: 12px;
    border-top: 1px solid #e5e7eb;
    background: white;
}

.chat-input input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 25px;
    border: 1px solid #d1d5db;
    font-size: 15px;
    outline: none;
}

.chat-input button {
    margin-left: 10px;
    border: none;
    padding: 10px 18px;
    border-radius: 25px;
    background: #4f46e5;
    color: white;
    font-weight: 500;
    cursor: pointer;
}

.chat-input button:hover {
    background: #4338ca;
}
</style>

<h2 class="text-center mb-2">Chat</h2>

<div class="chat-wrapper">

    <!-- messages -->
    <div class="chat-box">

        {% for m in messages %}

            {% if m.sender == request.user %}
                <div class="msg me">
                    {{ m.text }}
                    <div class="meta">You • {{ m.created_at|date:"H:i" }}</div>
                </div>
            {% else %}
                <div class="msg other">
                    {{ m.text }}
                    <div class="meta">{{ m.sender_type }} • {{ m.created_at|date:"H:i" }}</div>
                </div>
            {% endif %}

        {% endfor %}

    </div>

    <!-- input -->
    <form method="POST" action="{% url 'send_message' convo.id %}" class="chat-input">
        {% csrf_token %}
        <input type="text" name="text" placeholder="Type a message..." required>
        <button type="submit">Send</button>
    </form>

</div>

{% endblock %}
