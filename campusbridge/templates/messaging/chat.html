{% extends 'base.html' %}
{% block content%}
<h2> Chat</h2>
{% for m in messages %}
<div class="card p-2 mt-2">
<p>{{ m.text }}</p>
<small> {{m.sender_type}}</small>
</div>
    {% endfor %}
<form method="POST" action="{% url 'send_message' convo.id %}">
    {% csrf_token %}
   <input type="text" name="text">
    <button type="submit">Send
</button>
</form>
{% endblock %}
