{% extends 'base.html' %}
{% block content %}

<style>
.form-control::placeholder, .form-select::placeholder {
    color: #49495e !important;
    opacity: 1 !important;
    font-weight: 700 !important;
}

.form-control::-webkit-input-placeholder { color: #49495e !important; opacity: 1 !important; font-weight: 700 !important; }
.form-control::-moz-placeholder { color: #49495e !important; opacity: 1 !important; font-weight: 700 !important; }
.form-control:-ms-input-placeholder { color: #49495e !important; opacity: 1 !important; font-weight: 700 !important; }

.form-control, .form-select {
    color: #111111 !important;
    font-weight: 700 !important;
    border: 2px solid #b39eff !important;
    background: #ffffff !important;
}

.form-control:focus, .form-select:focus {
    border-color: #7d61ff !important;
    box-shadow: 0 0 0 4px rgba(125, 97, 255, 0.25) !important;
}

.login-link {
    color: #492ec4 !important;
    text-decoration: underline;
    font-weight: 800;
    transition: color 0.2s ease;
}

.login-link:hover {
    color: #210d7a !important;
}

.btn-primary-custom {
    background: linear-gradient(135deg, #6c4eff, #4a8bff);
    border: none;
    color: #ffffff !important;
    font-weight: 800;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 20px rgba(108, 78, 255, 0.35);
    transition: all 0.2s ease;
}

.btn-primary-custom:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
    box-shadow: 0 12px 24px rgba(108, 78, 255, 0.45);
}

.alert-danger {
    background-color: #ffd1d1 !important;
    border: 2px solid #f27474 !important;
    color: #820e17 !important;
    font-weight: 700;
    border-radius: 14px;
}
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card p-4" style="width: 430px; background: linear-gradient(135deg, #ffffff, #f7f4ff) !important; border: 2px solid #b39eff; box-shadow: 0 20px 40px rgba(115, 100, 130, 0.12); border-radius: 24px;">

        <div class="text-center mb-2" style="font-size: 2.2rem; filter: drop-shadow(0 4px 6px rgba(125, 97, 255, 0.4));">📜</div>
        <h2 class="mb-4 text-center" style="color: #11052C; font-weight: 800; letter-spacing: -0.5px;">Create Account</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <input type="text" class="form-control py-2.5" name="username" placeholder="Username" required>
            </div>

            <div class="mb-3">
                <input type="email" class="form-control py-2.5" name="email" placeholder="Email" required>
            </div>

            <div class="mb-3">
                <select class="form-select py-2.5" name="role" required>
                    <option value="" disabled selected style="color: #49495e;">Select Your Role</option>
                    <option value="student">Student</option>
                    <option value="counselor">Counselor</option>
                    <option value="staff">Staff</option>
                </select>
            </div>

            <div class="mb-4">
                <input type="password" class="form-control py-2.5" name="password" placeholder="Password" required>
            </div>

            <button class="btn btn-primary-custom w-100 py-2.5 rounded-5">
                Create Account
            </button>
        </form>

        {% if form.errors %}
        <div class="alert alert-danger mt-3 py-2 text-center small">
            {{ form.errors }}
        </div>
        {% endif %}

        <p class="text-center mt-4 mb-1" style="color: #111111; font-weight: 700; font-size: 0.95rem;">
            Already have an account?
            <a href="/login/" class="login-link">Login Here</a>
        </p>

    </div>

</div>

{% endblock %}
