{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="glass-card" style="width: 420px;">

        <h3 class="mb-3 text-center">Create Account</h3>

        <form method="POST">
            {% csrf_token %}

            <input class="form-control mb-2" name="username" placeholder="Username">

            <input class="form-control mb-2" name="email" placeholder="Email">

            <select class="form-control mb-2" name="role">
                <option>Student</option>
                <option>Counselor</option>
                <option>Staff</option>
            </select>

            <input class="form-control mb-2" type="password" name="password" placeholder="Password">

            <button class="btn btn-primary w-100 mt-2">Create Account</button>
        </form>

        <p class="text-center mt-3">
            Already have account?
            <a href="/login/">Login</a>
        </p>

    </div>
</div>

{% endblock %}
