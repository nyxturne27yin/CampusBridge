{% extends 'base.html' %}
{% block content %}

<style>
.form-control::placeholder{
    color: #d8ffe8;
    opacity: 1;
    text-shadow:
        0 0 4px rgba(168,255,208,0.7),
        0 0 8px rgba(168,255,208,0.5),
        0 0 14px rgba(168,255,208,0.35);
}

.form-control{
    color: #ffffff;
}
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">

    <div class="glass-card p-4" style="width: 420px; border-radius: 12px;">

        <h3 class="mb-3 text-center">Create Account</h3>

        <form method="POST">
            {% csrf_token %}

            <input class="form-control mb-3" name="username" placeholder="Username">

            <input class="form-control mb-3" name="email" placeholder="Email">

            <select class="form-control mb-3" name="role">
                <option value="student">Student</option>
                <option value="counselor">Counselor</option>
                <option value="staff">Staff</option>
            </select>

            <input class="form-control mb-3" type="password" name="password" placeholder="Password">

            <button class="btn btn-primary w-100 mt-2">
                Create Account
            </button>
        </form>

        {% if form.errors %}
        <div class="alert alert-danger mt-3 py-2">
            {{ form.errors }}
        </div>
        {% endif %}

        <p class="text-center mt-3 mb-0">
            Already have an account?
            <a href="/login/" class="text-primary">Login</a>
        </p>

    </div>

</div>

{% endblock %}
