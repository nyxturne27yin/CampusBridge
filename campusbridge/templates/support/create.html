{% extends 'base.html' %}
{% block content %}

<style>
    /* ================= FAIRYCORE SUBMIT SYSTEM COMPONENT ================= */

    .form-display-card {
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: 24px;
        padding: 32px;
        max-width: 700px;
        margin: 2rem auto;
        box-shadow: var(--neon-glow);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }

    /* Style injected into default form field paragraphs generated by Django */
    .form-display-card p {
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
    }

    /* Form Field Label overrides to maintain bright neon spore visibility */
    .form-display-card label {
        color: var(--spore-glow) !important;
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: 14.5px;
        letter-spacing: 0.5px;
        text-shadow: 0 0 8px rgba(168, 255, 208, 0.45);
        margin-bottom: 8px;
    }

    /* Input Fields styling matching the dark woodland aesthetic canopy */
    .form-display-card input,
    .form-display-card textarea,
    .form-display-card select {
        border-radius: 14px !important;
        border: 2px solid rgba(168, 255, 208, 0.15) !important;
        padding: 12px 16px !important;
        background: rgba(11, 17, 14, 0.85) !important;
        color: var(--text) !important;
        font-size: 15px;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5) !important;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
        width: 100%;
    }

    .form-display-card input:focus,
    .form-display-card textarea:focus,
    .form-display-card select:focus {
        background: rgba(18, 29, 23, 0.95) !important;
        border-color: var(--fairy-pink) !important;
        outline: 0 !important;
        box-shadow: 0 0 18px rgba(252, 161, 193, 0.35), inset 0 2px 5px rgba(0, 0, 0, 0.5) !important;
    }

    /* Hidden field list error tags format if validation fails */
    .form-display-card .errorlist {
        list-style: none;
        padding-left: 0;
        color: #fca1c1;
        font-size: 13px;
        margin-bottom: 6px;
        text-shadow: 0 0 6px rgba(252, 161, 193, 0.5);
    }

    /* Runic Action Submission Button adjustments */
    .btn-fairy-submit {
        background: linear-gradient(135deg, var(--deep-moss), var(--ancient-bark));
        border: 2px solid var(--spore-glow);
        color: var(--spore-glow) !important;
        border-radius: 16px;
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 1.5px;
        padding: 12px 24px;
        width: 100%;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4), var(--inner-bevel);
        transition: all 0.3s ease;
        text-shadow: 0 0 6px rgba(168, 255, 208, 0.5);
    }

    .btn-fairy-submit:hover {
        color: #ffffff !important;
        background: linear-gradient(135deg, rgba(168, 255, 208, 0.15), var(--deep-moss));
        border-color: var(--fairy-pink);
        box-shadow: 0 0 20px rgba(252, 161, 193, 0.6), var(--inner-bevel);
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        transform: translateY(-2px);
    }
</style>

<div class="container">

    <div class="form-display-card">

        <h2 class="mb-4 text-center" style="color: var(--spore-glow); text-shadow: 0 0 15px rgba(168, 255, 208, 0.45); font-size: 26px;">
            Submit Support Request
        </h2>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="mt-4 pt-2">
                <button type="submit" class="btn btn-fairy-submit">
                    Submit Request
                </button>
            </div>
        </form>

    </div>

</div>

{% endblock %}
