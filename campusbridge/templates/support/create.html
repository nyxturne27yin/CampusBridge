{% extends 'base.html' %}
{% block content %}

<style>
    .form-display-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(243, 239, 255, 0.85));
        border: 1px solid rgba(195, 176, 255, 0.5);
        border-radius: 24px;
        padding: 32px;
        max-width: 700px;
        margin: 2rem auto;
        box-shadow: 0 20px 40px rgba(115, 100, 130, 0.12);
        animation: smoothEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes smoothEntrance {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .form-display-card p {
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
    }

    .form-display-card label {
        color: #4a3e56 !important;
        font-weight: 700;
        font-size: 15px;
        margin-bottom: 8px;
    }

    .form-display-card input,
    .form-display-card textarea,
    .form-display-card select {
        border-radius: 16px !important;
        border: 1px solid rgba(110, 110, 140, 0.25) !important;
        padding: 12px 18px !important;
        background: #ffffff !important;
        color: #2b2b36 !important;
        font-weight: 600;
        font-size: 15px;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
        width: 100%;
    }

    .form-display-card input:focus,
    .form-display-card textarea:focus,
    .form-display-card select:focus {
        background: #ffffff !important;
        border-color: #b096ff !important;
        outline: 0 !important;
        box-shadow: 0 0 0 4px rgba(195, 176, 255, 0.25) !important;
    }

    .form-display-card .errorlist {
        list-style: none;
        padding-left: 0;
        color: #dc3545;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .btn-theme-submit {
        background: linear-gradient(135deg, #b096ff, #8cbfff);
        border: none;
        color: #ffffff !important;
        border-radius: 30px;
        font-weight: 700;
        font-size: 16px;
        padding: 12px 24px;
        width: 100%;
        box-shadow: 0 8px 20px rgba(195, 176, 255, 0.35);
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .btn-theme-submit:hover {
        transform: translateY(-2px);
        filter: brightness(1.03);
        box-shadow: 0 12px 26px rgba(195, 176, 255, 0.5);
    }
</style>

<div class="container">

    <div class="form-display-card">

        <div class="d-flex align-items-center justify-content-center mb-4 gap-2">
            <div style="font-size: 2rem; filter: drop-shadow(0 4px 6px rgba(195, 176, 255, 0.3));">🌱</div>
            <h2 class="mb-0 text-center" style="color: #3b2d4a; font-weight: 800; letter-spacing: -0.5px;">
                Submit Support Request
            </h2>
        </div>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="mt-4 pt-2">
                <button type="submit" class="btn btn-theme-submit">
                    Submit Request
                </button>
            </div>
        </form>

    </div>

</div>

{% endblock %}
