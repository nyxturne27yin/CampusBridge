{% extends 'base.html' %}

{% block content %}

<style>



    .support-card {
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: 24px;
        padding: 28px;
        box-shadow: var(--neon-glow);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }


    .form-label {
        color: var(--spore-glow) !important;
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.5px;
        text-shadow: 0 0 8px rgba(168, 255, 208, 0.5);
        margin-bottom: 8px;
    }


    .form-control, textarea.form-control {
        border-radius: 14px !important;
        border: 2px solid rgba(168, 255, 208, 0.15) !important;
        padding: 12px 16px !important;
        background: rgba(11, 17, 14, 0.85) !important;
        color: var(--text) !important;
        font-size: 15px;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5) !important;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    .form-control::placeholder {
        color: var(--muted) !important;
        opacity: 0.65;
    }

    .form-control:focus {
        background: rgba(18, 29, 23, 0.95) !important;
        border-color: var(--fairy-pink) !important;
        box-shadow: 0 0 18px rgba(252, 161, 193, 0.35), inset 0 2px 5px rgba(0, 0, 0, 0.5) !important;
    }


    .btn-submit {
        background: linear-gradient(135deg, var(--deep-moss), var(--ancient-bark));
        border: 2px solid var(--spore-glow);
        color: var(--spore-glow) !important;
        border-radius: 16px;
        font-family: 'Cinzel', serif;
        font-weight: 700;
        letter-spacing: 1.5px;
        padding: 12px 30px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4), var(--inner-bevel);
        transition: all 0.3s ease;
        text-shadow: 0 0 6px rgba(168, 255, 208, 0.5);
    }

    .btn-submit:hover {
        color: #ffffff !important;
        background: linear-gradient(135deg, rgba(168, 255, 208, 0.15), var(--deep-moss));
        border-color: var(--fairy-pink);
        box-shadow: 0 0 20px rgba(252, 161, 193, 0.6), var(--inner-bevel);
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        transform: translateY(-2px);
    }


    .request-item-card {
        background: rgba(18, 29, 23, 0.4);
        border: 1px solid rgba(168, 255, 208, 0.15);
        border-radius: 16px;
        padding: 20px;
        margin-top: 16px;
        transition: all 0.45s ease;
    }

    .request-item-card:hover {
        background: var(--card-strong);
        border-color: rgba(168, 255, 208, 0.4);
        transform: translateY(-4px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .request-title {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: 16px;
        color: var(--gold-dust);
        text-shadow: 0 0 8px rgba(227, 188, 118, 0.4);
    }

    .request-desc {
        color: var(--text);
        font-size: 14.5px;
        line-height: 1.6;
        margin-bottom: 0;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }


    .mythic-alert {
        background: rgba(168, 255, 208, 0.04);
        border: 1px dashed rgba(168, 255, 208, 0.2);
        border-radius: 14px;
        color: var(--muted);
        font-size: 14px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
</style>

<div class="container mt-4">

    <div class="support-card">
        <h2 class="mb-4 text-center" style="color: var(--spore-glow); text-shadow: 0 0 15px rgba(168, 255, 208, 0.45);">Support Request Form</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="form-label">Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="Enter request title"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label">Description</label>
                <textarea name="description"
                          class="form-control"
                          rows="5"
                          placeholder="Describe your issue..."
                          required></textarea>
            </div>

            <button type="submit" class="btn btn-submit w-100">
                Submit Request
            </button>
        </form>
    </div>

    <h3 class="mt-5" style="color: var(--spore-glow); text-shadow: 0 0 12px rgba(168, 255, 208, 0.45);">My Requests</h3>

    {% for r in requests %}
        <div class="request-item-card shadow-sm">
            <h5 class="request-title mb-2">✦ {{ r.title }}</h5>
            <p class="request-desc">{{ r.description }}</p>
        </div>
    {% empty %}
        <div class="mythic-alert p-4 mt-3 text-center">
             No active support requests tracked in the woods.
        </div>
    {% endfor %}

</div>

{% endblock %}
