{% extends 'base.html' %}

{% block content %}

<style>
    .support-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(243, 239, 255, 0.85));
        border: 1px solid rgba(195, 176, 255, 0.5);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 20px 40px rgba(115, 100, 130, 0.12);
        animation: smoothEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes smoothEntrance {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .form-label {
        color: #201230 !important;
        font-weight: 800;
        font-size: 15px;
        margin-bottom: 8px;
    }

    .form-control, textarea.form-control {
        border-radius: 16px !important;
        border: 1px solid #9999b3 !important;
        padding: 12px 18px !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-weight: 700;
        font-size: 15px;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    .form-control::placeholder {
        color: #555566 !important;
        opacity: 0.9;
    }

    .form-control:focus {
        background: #ffffff !important;
        border-color: #7d61ff !important;
        box-shadow: 0 0 0 4px rgba(125, 97, 255, 0.25) !important;
    }

    .btn-submit {
        background: linear-gradient(135deg, #7d61ff, #5c9eff);
        border: none;
        color: #ffffff !important;
        border-radius: 30px;
        font-weight: 800;
        font-size: 16px;
        padding: 12px 30px;
        box-shadow: 0 8px 20px rgba(125, 97, 255, 0.35);
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        filter: brightness(1.03);
        box-shadow: 0 12px 26px rgba(125, 97, 255, 0.5);
    }

    .request-item-card {
        background: #ffffff;
        border: 1px solid #c3b0ff;
        border-radius: 18px;
        padding: 20px;
        margin-top: 16px;
        box-shadow: 0 4px 12px rgba(40, 40, 80, 0.04);
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        animation: smoothEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        animation-delay: 0.15s;
    }

    .request-item-card:hover {
        transform: translateY(-3px);
        border-color: #7d61ff;
        box-shadow: 0 12px 24px rgba(125, 97, 255, 0.15);
    }

    .request-title {
        font-weight: 800;
        font-size: 16px;
        color: #201230;
    }

    .request-desc {
        color: #1a1a24;
        font-weight: 700;
        font-size: 14.5px;
        line-height: 1.6;
        margin-bottom: 0;
    }

    .theme-alert {
        background: #ffffff;
        border: 1px dashed #7d61ff;
        border-radius: 16px;
        color: #201230;
        font-weight: 700;
        font-size: 14.5px;
        box-shadow: 0 4px 12px rgba(40, 40, 80, 0.02);
    }
</style>

<div class="container mt-4">

    <div class="support-card">
        <div class="d-flex align-items-center justify-content-center mb-4 gap-2">
            <div style="font-size: 2rem; filter: drop-shadow(0 4px 6px rgba(195, 176, 255, 0.3));">🌱</div>
            <h2 class="mb-0 text-center" style="color: #201230; font-weight: 800; letter-spacing: -0.5px;">Support Request Form</h2>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="form-label">Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="Enter request title"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label">Description</label>
                <textarea name="description"
                          class="form-control"
                          rows="5"
                          placeholder="Describe your issue..."
                          required></textarea>
            </div>

            <button type="submit" class="btn btn-submit w-100">
                Submit Request
            </button>
        </form>
    </div>

    <div class="d-flex align-items-center mt-5 mb-3 gap-2">
        <div style="font-size: 1.5rem; filter: drop-shadow(0 4px 6px rgba(195, 176, 255, 0.2));">🌸</div>
        <h3 class="mb-0" style="color: #201230; font-weight: 800; letter-spacing: -0.5px;">My Requests</h3>
    </div>

    {% for r in requests %}
        <div class="request-item-card">
            <h5 class="request-title mb-2">✦ {{ r.title }}</h5>
            <p class="request-desc">{{ r.description }}</p>
        </div>
    {% empty %}
        <div class="theme-alert p-4 mt-3 text-center">
             No active support requests opened yet.
        </div>
    {% endfor %}

</div>

{% endblock %}
